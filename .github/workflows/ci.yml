name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # The same side-by-side layout the README asks for: config.yaml reads
      # the constituent list from ../finlake.
      - uses: actions/checkout@v5
        with:
          path: lodestar
      - uses: actions/checkout@v5
        with:
          repository: fletcheroverstreet/finlake
          path: finlake
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            lodestar/pyproject.toml
            finlake/pyproject.toml
      - name: Install
        run: pip install -e finlake -e lodestar pytest ruff
      - name: Lint
        working-directory: lodestar
        run: ruff check .
      - name: Test
        working-directory: lodestar
        run: python -m pytest -q
